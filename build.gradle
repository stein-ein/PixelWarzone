plugins {
    id 'net.neoforged.moddev' version '2.0.140'
    id 'com.gradleup.shadow' version '8.3.5'
}

version = '1.21.1-1.0.0'
group = 'com.github.steinein.pixelwarzone'
base { archivesName = 'pixelwarzone' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    shade
    implementation.extendsFrom(shade)
}

neoForge {
    version = '21.1.200'

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        server {
            type = 'server'
        }
    }

    mods {
        pixelwarzone {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Pixelmon — provided on the server, compile-only
    compileOnly fileTree(dir: 'libs', include: 'Pixelmon*.jar')

    // HikariCP connection pool + MySQL driver — shaded and relocated to avoid conflicts
    shade 'com.zaxxer:HikariCP:5.1.0'
    shade 'com.mysql:mysql-connector-j:9.1.0'
}

shadowJar {
    configurations = [project.configurations.shade]
    archiveClassifier = ''
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/maven/**'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    // Relocate to avoid conflicts with other mods that bundle the same libraries
    relocate 'com.zaxxer.hikari',  'com.github.steinein.pixelwarzone.shade.hikari'
    relocate 'com.mysql',          'com.github.steinein.pixelwarzone.shade.mysql'
    relocate 'org.slf4j',          'com.github.steinein.pixelwarzone.shade.slf4j'
    relocate 'com.google.protobuf', 'com.github.steinein.pixelwarzone.shade.protobuf'
}

assemble.dependsOn shadowJar
jar.enabled = false
